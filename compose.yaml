services:
  tls-checker:
    build:
      context: .
      dockerfile: Dockerfile
    image: tls-checker:dev
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2).status==200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
