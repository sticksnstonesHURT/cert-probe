name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies from lockfile
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest -q

  docker:
    name: Build, smoke test and publish
    runs-on: ubuntu-24.04
    needs: quality
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5.9.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Cert Probe
            org.opencontainers.image.description=TLS certificate inspection API

      - name: Build image locally
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Alias image for the local deployment
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          first_tag=$(printf '%s\n' "$TAGS" | head -n1)
          docker tag "$first_tag" cert-probe:dev
          echo "aliased $first_tag as cert-probe:dev"

      - name: Start deployment
        run: make up

      - name: Smoke checks
        run: make smoke

      - name: Assert runtime hardening
        run: |
          set -euo pipefail
          cid=$(docker compose ps -q cert-probe)
          test -n "$cid"
          test "$(docker inspect --format '{{.Config.User}}' "$cid")" = "app"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$cid")" = "true"
          test "$(docker inspect --format '{{.HostConfig.CapDrop}}' "$cid")" = "[ALL]"
          test "$(docker inspect --format '{{.HostConfig.PidsLimit}}' "$cid")" = "128"
          test "$(docker inspect --format '{{.HostConfig.NanoCpus}}' "$cid")" = "1000000000"
          test "$(docker inspect --format '{{.HostConfig.Memory}}' "$cid")" = "268435456"
          test "$(docker inspect --format '{{.HostConfig.Init}}' "$cid")" = "true"
          test "$(docker inspect --format '{{index .HostConfig.SecurityOpt 0}}' "$cid")" = "no-new-privileges:true"
          echo "hardening assertions passed"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image tags
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "pushing $tag"
            docker push "$tag"
          done <<< "$TAGS"

      - name: Report published digest
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "digest: ${{ steps.build.outputs.digest }}"
          printf 'tags:\n%s\n' "$TAGS"

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color || true

      - name: Tear down
        if: always()
        run: make down
