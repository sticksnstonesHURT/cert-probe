name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies from lockfile
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest -q

  docker:
    name: Build and smoke test
    runs-on: ubuntu-24.04
    needs: quality
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: cert-probe:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Start deployment
        run: make up

      - name: Smoke checks
        run: make smoke

      - name: Assert runtime hardening
        run: |
          set -euo pipefail
          cid=$(docker compose ps -q cert-probe)
          test -n "$cid"
          test "$(docker inspect --format '{{.Config.User}}' "$cid")" = "app"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$cid")" = "true"
          test "$(docker inspect --format '{{.HostConfig.CapDrop}}' "$cid")" = "[ALL]"
          test "$(docker inspect --format '{{.HostConfig.PidsLimit}}' "$cid")" = "128"
          test "$(docker inspect --format '{{.HostConfig.NanoCpus}}' "$cid")" = "1000000000"
          test "$(docker inspect --format '{{.HostConfig.Memory}}' "$cid")" = "268435456"
          test "$(docker inspect --format '{{.HostConfig.Init}}' "$cid")" = "true"
          test "$(docker inspect --format '{{index .HostConfig.SecurityOpt 0}}' "$cid")" = "no-new-privileges:true"
          echo "hardening assertions passed"

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color || true

      - name: Tear down
        if: always()
        run: make down
