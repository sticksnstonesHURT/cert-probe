# Shared implementation, called by pr.yml and publish.yml.
#
# No concurrency block: the caller owns queueing.
# No workflow-level permissions block: a called workflow can only downgrade the
# caller's token, so the calling job grants the maximum and each job narrows it.

name: Pipeline

on:
  workflow_call:
    inputs:
      publish:
        description: Push per-architecture images and stitch the OCI index
        required: true
        type: boolean

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies from lockfile
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest -q

  build:
    name: Build and smoke test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: quality
    timeout-minutes: 25
    # No permissions block here on purpose: this job inherits the caller's
    # GITHUB_TOKEN. PR callers grant contents: read only; the publishing caller
    # grants contents: read and packages: write, which the push steps need.
    # Declaring any permission here would reset every unlisted scope to none,
    # making packages: none and breaking docker push on the publishing path.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
          flavor: |
            suffix=-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=Cert Probe
            org.opencontainers.image.description=TLS certificate inspection API

      - name: Build image locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false

      - name: Alias image for the local deployment
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          first_tag=$(printf '%s\n' "$TAGS" | head -n1)
          docker tag "$first_tag" cert-probe:dev
          echo "aliased $first_tag as cert-probe:dev"

      - name: Start deployment
        run: make up

      - name: Smoke checks
        run: make smoke

      - name: Assert runtime hardening
        run: |
          set -euo pipefail
          cid=$(docker compose ps -q cert-probe)
          test -n "$cid"
          test "$(docker inspect --format '{{.Config.User}}' "$cid")" = "app"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$cid")" = "true"
          test "$(docker inspect --format '{{.HostConfig.CapDrop}}' "$cid")" = "[ALL]"
          test "$(docker inspect --format '{{.HostConfig.PidsLimit}}' "$cid")" = "128"
          test "$(docker inspect --format '{{.HostConfig.NanoCpus}}' "$cid")" = "1000000000"
          test "$(docker inspect --format '{{.HostConfig.Memory}}' "$cid")" = "268435456"
          test "$(docker inspect --format '{{.HostConfig.Init}}' "$cid")" = "true"
          test "$(docker inspect --format '{{index .HostConfig.SecurityOpt 0}}' "$cid")" = "no-new-privileges:true"
          echo "hardening assertions passed"

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push architecture image
        if: inputs.publish
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tag=$(printf '%s\n' "$TAGS" | head -n1)
          echo "pushing $tag"
          docker push "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Record and verify registry digest
        if: inputs.publish
        env:
          TAG: ${{ steps.push.outputs.tag }}
          ARCH: ${{ matrix.arch }}
          REPO: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail

          repo_lc=$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')

          # Gate 1: exactly one RepoDigests entry for this repository.
          mapfile -t found < <(
            docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$TAG" \
              | awk -v p="$repo_lc@" 'index($0, p) == 1 { print substr($0, length(p) + 1) }'
          )
          if [ "${#found[@]}" -ne 1 ]; then
            echo "::error::expected exactly one RepoDigests entry for $repo_lc, found ${#found[@]}"
            printf '  %s\n' "${found[@]:-<none>}"
            exit 1
          fi

          # Gate 2: a manifest digest, not a config digest or an image ID.
          digest="${found[0]}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::captured value is not a manifest digest: $digest"
            exit 1
          fi

          # Gate 3: the registry agrees. Retried, because a freshly pushed
          # manifest can be briefly invisible; it still ends in exit 1.
          observed=""
          for attempt in $(seq 1 6); do
            observed=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$TAG" 2>/dev/null || true)
            [ "$observed" = "$digest" ] && break
            echo "attempt $attempt/6: registry reports '${observed:-<empty>}'"
            sleep 5
          done

          if [ "$observed" != "$digest" ]; then
            if [ -z "$observed" ]; then
              echo "::error::$TAG was not visible in the registry after 6 attempts (~30s)"
            else
              echo "::error::$TAG resolves to a different manifest than the pushed image"
              echo "  pushed:   $digest"
              echo "  registry: $observed"
            fi
            exit 1
          fi

          # Gate 4: hand off exactly one validated digest.
          printf '%s\n' "$digest" > "digest-$ARCH.txt"
          echo "$ARCH manifest digest: $digest"

      - name: Upload architecture digest
        if: inputs.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digest-${{ matrix.arch }}.txt
          retention-days: 1

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color || true

      - name: Tear down
        if: always()
        run: make down
